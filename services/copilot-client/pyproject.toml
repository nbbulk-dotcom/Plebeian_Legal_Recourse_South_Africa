description = "Copilot client proxy for Constitutional Liberation Platform"
authors = ["nicolas <nbbulk@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.104.1"
httpx = "0.25.2"
sqlalchemy = "2.0.23"
alembic = "1.13.0"
pydantic = "^2.7.0"
