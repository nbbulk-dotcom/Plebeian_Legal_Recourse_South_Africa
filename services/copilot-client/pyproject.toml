psycopg2-binary = "2.9.9"
python-dotenv = "1.0.0"
uvicorn = "0.24.0"
tenacity = "8.2.2"

[tool.poetry.dev-dependencies]
pytest = "7.4.0"
pytest-asyncio = "0.21.0"
httpx = "0.25.2"
