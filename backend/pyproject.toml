[tool.poetry]
name = "constitutional-liberation-platform"
version = "1.0.0"
description = "Revolutionary AI-Powered Constitutional Justice Platform Backend"
authors = ["Plebeian Tribunal Academy <tribuneplebeian@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "3.12.10"
fastapi = "0.104.1"
uvicorn = {extras = ["standard"], version = "0.24.0"}
pydantic = "2.11.9"
sqlalchemy = "2.0.23"
alembic = "1.13.0"
psycopg2-binary = "2.9.9"
python-multipart = "0.0.6"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
aiofiles = "23.2.1"
httpx = "0.25.2"
aiohttp = "3.10.11"
beautifulsoup4 = "4.12.2"
jinja2 = "3.1.2"
python-docx = "1.1.0"
reportlab = "4.0.7"
pandas = "2.1.4"
numpy = "1.26.2"
scikit-learn = "1.3.2"
pydantic-settings = "2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
black = "23.11.0"
isort = "5.12.0"
flake8 = "6.1.0"
mypy = "1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
